name: Сборка приложения для Windows

# Собирает установщик и переносную версию «Регламент-ТС» на сервере с Windows.
# Запускается при изменении программы или приложения, вручную и при создании тега v*.
on:
  push:
    branches: ['**']
    paths:
      - 'index.html'
      - 'app/**'
      - '.github/workflows/build-windows.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Тест файлового хранилища
        run: npm test

      - name: Сборка установщика и переносной версии
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # подпись кодом не используется

      - name: Файлы сборки
        shell: bash
        run: ls -la dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: reglament-ts-windows
          path: |
            app/dist/Reglament-TS-Setup-*.exe
            app/dist/Reglament-TS-Portable-*.exe
          if-no-files-found: error

      - name: Выпуск (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/Reglament-TS-Setup-*.exe
            app/dist/Reglament-TS-Portable-*.exe
