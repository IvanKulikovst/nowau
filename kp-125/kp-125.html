<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Анатомия КП-125</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;

  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.kp-stage { position: relative; touch-action: pan-y; outline: none; }
.kp-stage > svg, .kp-stage > canvas { display: block; width: 100%; height: auto; }
.kp-stage > .kp-layer { position: absolute; inset: 0; height: 100% !important; pointer-events: none; }
.kp-stage:focus-visible { box-shadow: 0 0 0 2px var(--anatomy-mid); border-radius: 6px; }

/* топка изнутри: закопчённая футеровка, тёплая от пламени */
.kp-cavity {
  --kp-heat: 0;
  --anatomy-paper: color-mix(in srgb, #4a453f, #8a4a24 calc(var(--kp-heat) * 30%));
  --anatomy-face: color-mix(in srgb, #554f48, #9a5428 calc(var(--kp-heat) * 30%));
  --anatomy-top: color-mix(in srgb, #5c564e, #a85c2c calc(var(--kp-heat) * 30%));
  --anatomy-shade-0: color-mix(in srgb, #3a3631, #6e3a1c calc(var(--kp-heat) * 30%));
  --anatomy-shade-1: color-mix(in srgb, #403b36, #7a4020 calc(var(--kp-heat) * 30%));
  --anatomy-shade-2: color-mix(in srgb, #47423c, #864624 calc(var(--kp-heat) * 30%));
  --anatomy-shade-3: color-mix(in srgb, #4e4842, #924c26 calc(var(--kp-heat) * 30%));
  --anatomy-hi: color-mix(in srgb, #a19a90, #e0a070 calc(var(--kp-heat) * 55%));
  --anatomy-mid: color-mix(in srgb, #7d776e, #c07a48 calc(var(--kp-heat) * 55%));
  --anatomy-lo: #625c54;
  --anatomy-faint: color-mix(in srgb, #5a544c, #8a5232 calc(var(--kp-heat) * 55%));
}
.iso[data-theme="dark"] .kp-cavity {
  --anatomy-paper: color-mix(in srgb, #161412, #3a1a0a calc(var(--kp-heat) * 40%));
  --anatomy-face: color-mix(in srgb, #1c1a17, #44200c calc(var(--kp-heat) * 40%));
  --anatomy-top: color-mix(in srgb, #201d1a, #4c240e calc(var(--kp-heat) * 40%));
  --anatomy-shade-0: #121110; --anatomy-shade-1: #151311; --anatomy-shade-2: #181614; --anatomy-shade-3: #1b1917;
  --anatomy-hi: color-mix(in srgb, #8a8278, #ffb070 calc(var(--kp-heat) * 50%));
  --anatomy-mid: color-mix(in srgb, #57524b, #c8763c calc(var(--kp-heat) * 50%));
  --anatomy-lo: #3a3631;
  --anatomy-faint: color-mix(in srgb, #2c2925, #5a2c14 calc(var(--kp-heat) * 50%));
}

.kp-logs { opacity: var(--kp-wood, 0); transition: opacity .6s var(--anatomy-ease); }

/* без WebGL: плоские языки пламени */
.kp-flame-fb { fill: #f08a2c; mix-blend-mode: multiply; opacity: 0; }
.iso[data-theme="dark"] .kp-flame-fb { fill: #ff8a3c; mix-blend-mode: screen; }
.kp-flame-fb.kp-liquid { opacity: calc(var(--kp-jet, 0) * .85); }
.kp-flame-fb.kp-solid { opacity: calc(var(--kp-wood-fire, 0) * .6); }
.kp-stage[data-gl] .kp-fallback { display: none; }

.iso:not([data-theme="light"]) .kp-fire, .iso:not([data-theme="light"]) .kp-air { mix-blend-mode: screen; }
.iso[data-theme="light"] .kp-air { mix-blend-mode: normal; }
.iso:not([data-theme="light"]) .kp-air { mix-blend-mode: normal; }

/* резина шин */
.kp-rubber { --anatomy-paper: #55534f; --anatomy-face: #5d5b57; --anatomy-top: #64625e; --anatomy-shade-0: #42403d; --anatomy-shade-1: #4a4845; --anatomy-shade-2: #52504c; --anatomy-shade-3: #5a5854; --anatomy-lo: #7a7873; --anatomy-faint: #6c6a66; }
.iso[data-theme="dark"] .kp-rubber { --anatomy-paper: #0c0c0c; --anatomy-face: #101010; --anatomy-top: #121212; --anatomy-shade-0: #080808; --anatomy-shade-1: #0a0a0a; --anatomy-shade-2: #0c0c0c; --anatomy-shade-3: #0e0e0e; --anatomy-lo: #2e2e2e; --anatomy-faint: #222; }

/* котлы в топке: нержавейка, подсвеченная пламенем снизу */
.kp-cavity .kp-kettle { --anatomy-paper: color-mix(in srgb, #a7a39c, #e09050 calc(var(--kp-heat) * 30%)); --anatomy-face: color-mix(in srgb, #b3afa8, #e89a58 calc(var(--kp-heat) * 30%)); --anatomy-top: #bdb9b2; --anatomy-shade-0: color-mix(in srgb, #8e8a83, #c06a30 calc(var(--kp-heat) * 35%)); --anatomy-shade-1: color-mix(in srgb, #99958e, #c87236 calc(var(--kp-heat) * 35%)); --anatomy-shade-2: color-mix(in srgb, #a4a099, #d07a3c calc(var(--kp-heat) * 35%)); --anatomy-shade-3: color-mix(in srgb, #afaba4, #d88242 calc(var(--kp-heat) * 35%)); --anatomy-hi: #57524b; --anatomy-faint: #8a857d; }
.iso[data-theme="dark"] .kp-cavity .kp-kettle { --anatomy-paper: color-mix(in srgb, #2c2a27, #5a2a10 calc(var(--kp-heat) * 40%)); --anatomy-face: #33302c; --anatomy-top: #383531; --anatomy-shade-0: color-mix(in srgb, #23211f, #4a220c calc(var(--kp-heat) * 40%)); --anatomy-shade-1: color-mix(in srgb, #282624, #522610 calc(var(--kp-heat) * 40%)); --anatomy-shade-2: color-mix(in srgb, #2d2b28, #5a2a12 calc(var(--kp-heat) * 40%)); --anatomy-shade-3: color-mix(in srgb, #32302c, #622e14 calc(var(--kp-heat) * 40%)); --anatomy-hi: #b8b0a4; --anatomy-faint: #4a4640; }

/* армейская олива: корпус, рама, крылья, навес */
.kp-olive, .kp-inside {
  --anatomy-paper: #727852; --anatomy-face: #7b8159; --anatomy-top: #899066;
  --anatomy-shade-0: #5c6243; --anatomy-shade-1: #646a49; --anatomy-shade-2: #6c724f; --anatomy-shade-3: #747a56;
  --anatomy-lit-top: #a2a878; --anatomy-lit-shade: #868c61;
  --anatomy-hi: #22251a; --anatomy-mid: #3a3e2c; --anatomy-lo: #4a4f37; --anatomy-faint: #5b6045; --anatomy-dot: #22251a; --anatomy-lit: #0b0c08;
}
.kp-inside { --anatomy-paper: #5d6243; --anatomy-face: #646a49; --anatomy-top: #6c724f; --anatomy-shade-0: #494e35; --anatomy-shade-1: #50553a; --anatomy-shade-2: #575c40; --anatomy-shade-3: #5e6345; }
.iso[data-theme="dark"] .kp-olive, .iso[data-theme="dark"] .kp-inside {
  --anatomy-paper: #2b2e1f; --anatomy-face: #34382a; --anatomy-top: #3b3f2b;
  --anatomy-shade-0: #222519; --anatomy-shade-1: #26291c; --anatomy-shade-2: #2a2d1f; --anatomy-shade-3: #2e3122;
  --anatomy-lit-top: #4c5236; --anatomy-lit-shade: #3a3e2a;
  --anatomy-hi: #d6d9c0; --anatomy-mid: #8b8f70; --anatomy-lo: #5d6147; --anatomy-faint: #444831; --anatomy-dot: #d6d9c0; --anatomy-lit: #ffffff;
}

function settle(state, target, dt, seconds, calm = false) {

    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }

  const power = (f.eta * rate * f.lhv) / 3600;
  const loss = M.LOSS * (heat.T - M.T_AIR);
  if (heat.T >= M.T_BOIL - 1e-6 && power > loss) {
    heat.T = M.T_BOIL;
    heat.steam = ((power - loss) / M.LATENT) * 3600;
  } else {
    heat.T = Math.min(M.T_BOIL, heat.T + ((power - loss) / M.C) * dt);
    heat.steam = 0;
  }
}
let fuel = "liquid";
let burning = false;
let rate = 0;
let want = FUELS.liquid.nominal;
let minutes = 0;
const env = { jet: { x: 0, v: 0 }, wood: { x: 0, v: 0 }, steam: { x: 0, v: 0 }, smoke: { x: 0, v: 0 }, swap: { x: 1, v: 0 } };

// ---------- тур без участия зрителя ----------
let touring = !still.matches;
let tourClock = 0;
let phase = "cold";
let phaseClock = 0;
let tourFuel = "liquid";
let idleTimer = 0;
function setPhase(next) { phase = next; phaseClock = 0; }
function tourStep(dt) {
  phaseClock += dt;
  if (phase === "cold" && phaseClock > 1.6) { fuel = tourFuel; want = FUELS[fuel].nominal; ignite(true); setPhase("heat"); }
  else if (phase === "heat" && heat.T >= M.T_BOIL) setPhase("boil");
  else if (phase === "boil" && phaseClock > 4) { want = fuel === "liquid" ? 4 : 16; setPhase("simmer"); }
  else if (phase === "simmer" && phaseClock > 7) { ignite(false); setPhase("out"); }
  else if (phase === "out" && phaseClock > 3) setPhase("reset");
  else if (phase === "reset" && phaseClock > 1.2) { heat.T = M.T_AIR; heat.steam = 0; minutes = 0; tourFuel = tourFuel === "liquid" ? "solid" : "liquid"; setPhase("cold"); }
}
function ignite(on) {
  burning = on;
  if (on && heat.T <= M.T_AIR + 0.01) minutes = 0;
}

// ---------- кадр ----------
let frame = 0, last = 0, clock = 0, visible = false;
function draw(dt) {
  const calm = still.matches;
  const f = FUELS[fuel];
  const target = burning ? want : 0;
  rate += (target - rate) * (calm ? 1 : 1 - Math.exp(-dt / 0.5));
  const simDt = dt * M.SPEED;
  if (burning || heat.T > M.T_AIR) minutes += simDt / 60;
  stepHeat(fuel, Math.max(rate, 0), simDt);
  const share = rate / f.max;
  settle(env.jet, fuel === "liquid" && burning ? 0.25 + 0.75 * share : 0, dt, 0.35, calm);
  settle(env.wood, fuel === "solid" && burning ? 0.3 + 0.7 * share : 0, dt, 0.8, calm);
  settle(env.steam, Math.min(1, heat.steam / 30) + (heat.T > 85 ? (heat.T - 85) / 60 : 0), dt, 0.9, calm);
  settle(env.smoke, burning ? (fuel === "solid" ? 0.9 : 0.35 + 0.3 * share) : 0, dt, 1.2, calm);
  settle(env.swap, fuel === "solid" ? 1 : 0, dt, 0.6, calm);
  const fireLevel = Math.max(env.jet.x, env.wood.x);
  cavityEl.style.setProperty("--kp-heat", fireLevel.toFixed(3));
  cavityEl.style.setProperty("--kp-jet", env.jet.x.toFixed(3));
  cavityEl.style.setProperty("--kp-wood-fire", env.wood.x.toFixed(3));
  cavityEl.style.setProperty("--kp-wood", fuel === "solid" || env.wood.x > 0.02 ? "1" : "0");
  const time = calm ? 0.8 : clock;
  if (fire) (env.jet.x > 1e-3 || env.wood.x > 1e-3) ? fire.draw({ uJet: env.jet.x, uWood: env.wood.x }, time) : fire.clear();
  if (air) {
    const s = env.steam.x;
    if (s > 1e-3 || env.smoke.x > 1e-3) air.draw({ uSteam0: s, uSteam1: s * 0.8, uSteam2: s * 0.95, uSmoke: env.smoke.x, uSoot: env.swap.x }, time);
    else air.clear();
  }
  const rateText = rate > 0.05 ? `${fuel === "liquid" ? "форсунки" : "дрова"} ${rate.toFixed(1).replace(".", ",")} кг/ч` : fuel === "liquid" ? "форсунки погашены" : "очаг погашен";
  const state = heat.T >= M.T_BOIL ? `кипит · пар ${Math.round(heat.steam)} кг/ч` : `вода ${Math.round(heat.T)} °C`;
  const text = `${Math.floor(minutes)} мин · ${state} · ${rateText}`;
  if (readout && readout.textContent !== text) readout.textContent = text;
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (touring) tourStep(dt);
  draw(dt);
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
addEventListener("resize", () => draw(0));

// ---------- управление ----------
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; if (touring) { setPhase(burning ? (heat.T >= M.T_BOIL ? "boil" : "heat") : "cold"); tourFuel = fuel; } }, 9000);
}
stage.addEventListener("keydown", (event) => {
  const f = FUELS[fuel];
  if (event.key === " " || event.key === "Enter") { ignite(!burning); if (burning && want < f.min) want = f.nominal; }
  else if (event.key === "f" || event.key === "F" || event.key === "а" || event.key === "А") { fuel = fuel === "liquid" ? "solid" : "liquid"; want = FUELS[fuel].nominal; }
  else if (event.key === "ArrowRight" || event.key === "ArrowUp") want = Math.min(f.max, want + (fuel === "liquid" ? 0.5 : 2));
  else if (event.key === "ArrowLeft" || event.key === "ArrowDown") want = Math.max(f.min, want - (fuel === "liquid" ? 0.5 : 2));
  else return;
  event.preventDefault();
  takeOver();
});
stage.addEventListener("click", () => { stage.focus(); ignite(!burning); if (burning) want = FUELS[fuel].nominal; takeOver(); });
if (still.matches) { fuel = "liquid"; burning = true; want = 8.5; rate = 8.5; heat.T = 100; heat.steam = 20; minutes = 60; }
draw(0);
</script></body></html>
