# Локальный reverse proxy (v1.0): /api → backend, / → frontend (Vite dev, с WebSocket для HMR).
# Включается профилем:  docker compose --profile proxy up   → http://localhost:8080
server {
    listen 80;
    client_max_body_size 25m;

    location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health  { proxy_pass http://backend:8000; }
    location = /ready   { proxy_pass http://backend:8000; }
    location /docs      { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
