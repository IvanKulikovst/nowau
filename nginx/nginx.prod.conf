# Продакшн (v2.0), SSL. Переменная ${DOMAIN} подставляется официальным образом nginx (templates).
#
# Получение сертификата (certbot, один раз, пока nginx работает на :80):
#   docker run --rm -v $PWD/nginx/certbot-www:/var/www/certbot -v $PWD/nginx/ssl:/etc/letsencrypt \
#     certbot/certbot certonly --webroot -w /var/www/certbot -d $DOMAIN --agree-tos -m you@example.com
# Затем скопируйте/слинкуйте файлы в nginx/ssl/ так, чтобы существовали:
#   nginx/ssl/fullchain.pem  и  nginx/ssl/privkey.pem     (из live/$DOMAIN/ certbot)
# Продление: повторить команду с `renew` по cron и выполнить `docker compose -f docker-compose.prod.yml exec nginx nginx -s reload`.

server {
    listen 80;
    server_name ${DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};
    client_max_body_size 25m;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api/      { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location = /health  { proxy_pass http://backend:8000; }
    location = /ready   { proxy_pass http://backend:8000; }
    location /docs      { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }
    # /metrics наружу не публикуется
    location = /metrics { return 404; }

    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
