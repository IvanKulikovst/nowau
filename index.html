  ${sets.size === 1 ? `<h3>Показатель сформированности по курсантам</h3>${lineChart({ labels: list.map((a, i) => String(i + 1)), yMin: 0, yMax: 0.35, series: [{ name: 'Псфк ВПК', color: '#2f6fa8', values: vals }] })}` : ''}` : '<div class="empty">Нет утверждённых расчётов для выбранных условий.</div>'}</div>`;
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.sum; if (!k) return; ui.summary[k] = e.target.value; if (k === 'type') ui.summary.sub = ''; render(); });
actions['csv-summary'] = () => {
  const S = ui.summary; const rows = [['№', 'Курсант / выпускник', 'Группа', S.type === 'practice' ? 'Курс' : 'Год службы', 'Оценка руководителя (ср.)', 'Степень сформированности, %', 'Показатель сформированности', 'Место', 'Уровень', 'Оценка руководителя практики', 'Оценка комиссии']];
  (ui.summaryRows || []).forEach(({ a, rank }, i) => { const v = a.result.vpk; const lv = S.type === 'graduate' ? (v.levelPsfk || v.levelBsr) : v.levelBsr; const o = state.objects.find(x => x.id === a.objectId) || {};
    rows.push([i + 1, o.name, o.group || '', S.type === 'practice' ? a.meta.course : a.meta.period, csvNum(v.meanGrade), csvNum(v.meanPct), csvNum(v.meanPsfk), rank, lv ? levelInfo(lv.code).name : '', a.input.leaderMark || '', a.input.commissionMark || '']); });
  download(`сводная_${new Date().toISOString().slice(0, 10)}.csv`, toCsv(rows), 'text/csv;charset=utf-8');
};

/* ---------- Данные и резервные копии ---------- */
route(/^\/data$/, () => {
  const st = Store.status();
  const size = (() => { try { return new Blob([JSON.stringify(state)]).size; } catch (e) { return 0; } })();
  return `<h1>Данные и резервные копии</h1>
  <div class="card"><h2>Хранение</h2>
  <p>Данные сохраняются в хранилище браузера (localStorage) на этом компьютере, отдельно для каждого браузера. Состояние: <b>${st.available ? 'доступно' : 'недоступно'}</b>${st.error ? ' — ' + esc(st.error) : ''}. Объём данных: ${(size / 1024).toFixed(1)} КБ.</p>
  <div class="note warn">При открытии файла через file:// некоторые браузеры (или режим «инкогнито», очистка истории, политики безопасности) могут не сохранять данные или хранить их отдельно для разных папок. Гарантированный способ сохранить работу — регулярная резервная копия в файл JSON.</div>
  <p class="muted">Последняя резервная копия: ${state.meta.lastBackupAt ? fmtDT(state.meta.lastBackupAt) : 'не создавалась'}.</p></div>
  <div class="card"><h2>Резервная копия</h2><div class="row"><button class="btn primary" data-act="backup">Сохранить резервную копию (JSON)</button>
    <label class="btn" for="importFile">Восстановить из файла…</label><input type="file" id="importFile" accept=".json,application/json" hidden></div>
  <p class="hint">Резервная копия содержит объекты оценки, все расчёты со снимками методики, редакции, пользовательские наборы Кзнк, экспертизы, учебные планы и модели признаков.</p></div>
  <div class="card"><h2>Экспорт для анализа</h2><div class="row"><button class="btn" data-act="csv-all">CSV: все расчёты (исходные данные и результаты)</button><button class="btn" data-act="csv-objects">CSV: объекты оценки</button><button class="btn" data-act="json-results">JSON: утверждённые результаты</button></div>
  <p class="hint">CSV — разделитель «;», десятичная запятая, кодировка UTF-8 с BOM (открывается в Microsoft Excel).</p></div>
  <div class="card"><h2>Очистка</h2><button class="btn danger" data-act="wipe">Удалить все данные</button><p class="hint">Перед удалением будет предложено сохранить резервную копию.</p></div>`;
});
actions.backup = () => {
  state.meta.lastBackupAt = Store.nowIso(); persist();
  download(`ПФК-ВПК_резервная_копия_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`, JSON.stringify(Store.exportPayload(state), null, 1), 'application/json');
  toast('Резервная копия сохранена'); render();
};
actions['csv-all'] = () => { if (!state.assessments.length) { toast('Нет расчётов', true); return; } download(`расчёты_все_${new Date().toISOString().slice(0, 10)}.csv`, toCsv(assessmentRows(state.assessments)), 'text/csv;charset=utf-8'); };
actions['csv-objects'] = () => download(`объекты_${new Date().toISOString().slice(0, 10)}.csv`, toCsv([['ID', 'Фамилия И.О.', 'Группа', 'Специальность', 'Год/курс', 'Примечание'], ...state.objects.map(o => [o.id, o.name, o.group, o.specialty, o.year, o.notes])]), 'text/csv;charset=utf-8');
actions['json-results'] = () => {
  const out = state.assessments.filter(a => a.status === 'final').map(a => ({ id: a.id, object: objName(a.objectId), type: a.type, date: a.meta.date, meta: a.meta, methodVersion: a.snapshot.methodVersion, input: a.input, result: a.result }));
  download(`результаты_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'ПФК-ВПК калькулятор', exportedAt: Store.nowIso(), results: out }, null, 1), 'application/json');
};
document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile' || !e.target.files.length) return;
  const file = e.target.files[0]; e.target.value = '';
  const text = await file.text();
  const p = Store.parseImport(text);
  if (!p.ok) { toast('Импорт невозможен: ' + p.error, true); return; }
  const d = p.data;
  const choice = await dialog('Восстановление данных', `<p>Файл «${esc(file.name)}»: объектов ${d.objects.length}, расчётов ${d.assessments.length}, наборов Кзнк ${d.coefSets.length}, учебных планов ${d.curricula.length}, моделей Y ${d.yModels.length}.</p><p><b>Заменить</b> — текущие данные будут удалены. <b>Объединить</b> — добавятся записи с новыми идентификаторами, существующие не изменятся.</p>`,
    [{ label: 'Отмена', value: null }, { label: 'Объединить', value: 'merge' }, { label: 'Заменить', value: 'replace', cls: 'danger' }]);
  if (!choice) return;
  if (choice === 'replace') state = d;
  else for (const k of ['objects', 'assessments', 'coefSets', 'expertStudies', 'curricula', 'yModels']) { const ids = new Set(state[k].map(x => x.id)); state[k].push(...d[k].filter(x => !ids.has(x.id))); }
  persist(); toast('Данные восстановлены'); render();
});
actions.wipe = async () => {
  const c = await dialog('Удалить все данные?', '<p>Будут удалены все объекты, расчёты, редакции и пользовательские справочники. Действие необратимо.</p>', [{ label: 'Отмена', value: null }, { label: 'Сначала сохранить копию', value: 'backup' }, { label: 'Удалить всё', value: 'wipe', cls: 'danger' }]);
  if (c === 'backup') { actions.backup(); return; }
  if (c !== 'wipe') return;
  state = Store.empty(); persist(); toast('Данные удалены'); location.hash = '#/';
};

/* ---------- Самопроверка ---------- */
route(/^\/tests$/, () => {
  const t0 = performance.now(); const res = SelfTests.run(); const dt = performance.now() - t0;
  const storage = (() => { try { const k = 'pfk-selftest'; localStorage.setItem(k, JSON.stringify({ v: 1 })); const ok = JSON.parse(localStorage.getItem(k)).v === 1; localStorage.removeItem(k); return ok; } catch (e) { return false; } })();
  res.push({ group: 'Среда', name: 'Запись и чтение localStorage', ok: storage, detail: storage ? '' : 'хранилище недоступно — используйте резервные копии' });
  const failed = res.filter(r => !r.ok);
  return `<h1>Самопроверка вычислительного модуля</h1>
  <div class="note ${failed.length ? 'err' : 'ok'}"><b>${res.length - failed.length} из ${res.length} проверок пройдено</b> за ${dt.toFixed(0)} мс. ${failed.length ? 'Обнаружены ошибки — результаты расчётов могут быть недостоверны.' : 'Контрольные примеры источников воспроизводятся.'}</div>
  <div class="card"><div class="table-wrap"><table><thead><tr><th>Группа</th><th>Проверка</th><th>Результат</th></tr></thead><tbody>
  ${res.map(r => `<tr><td>${esc(r.group)}</td><td>${esc(r.name)}${r.detail ? `<div class="src" style="color:var(--danger)">${esc(r.detail)}</div>` : ''}</td><td>${r.ok ? '<span class="badge b-final">пройдено</span>' : '<span class="badge b-draft" style="color:var(--danger)">ошибка</span>'}</td></tr>`).join('')}
  </tbody></table></div></div>`;
});

/* ---------- Запуск ---------- */
$('#menuBtn').addEventListener('click', () => { const s = $('#side'); s.classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', s.classList.contains('open')); });
window.addEventListener('hashchange', () => { if (!/^#\/a\/[\w-]+\/edit/.test(location.hash)) { if (ui.editing) persist(); ui.editing = null; } render(); });
window.addEventListener('beforeunload', () => { clearTimeout(ui.saveTimer); Store.save(state); });
window.addEventListener('storage', e => { if (e.key && e.key.startsWith('pfk-vpk-calculator')) { state = Store.load(); render(); toast('Данные обновлены в другой вкладке'); } });
renderStorage();
render();

</script>
</body>
</html>
